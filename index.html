<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اونو</title>
<style>
:root{--bg:#1d3b34;--felt:#25493f;--ink:#f4efe3;--r:#d8402f;--y:#f2b705;--g:#2e9e5b;--b:#2a6fc9;--w:#262626}
@media (prefers-color-scheme:light){:root{--bg:#e8efe9;--felt:#cfe0d4;--ink:#1b2a25}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;padding:12px;gap:12px}
h1{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center}
button{font:inherit;cursor:pointer}
.new{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:4px 12px}
#opp{display:flex;gap:8px}
.op{flex:1;background:var(--felt);border-radius:10px;padding:8px;text-align:center;font-size:14px;border:2px solid transparent}
.op.on,.me.on{border-color:var(--y)}
.op b{display:block;font-size:22px}
#mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;background:var(--felt);border-radius:14px;padding:16px;min-height:190px}
.card{width:64px;height:96px;border-radius:9px;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:none;position:relative;user-select:none;text-shadow:0 1px 2px #0006}
.card.y{color:#222;text-shadow:none}
.back{background:repeating-linear-gradient(45deg,#222,#222 6px,#3a3a3a 6px,#3a3a3a 12px);font-size:15px}
.hand .card{cursor:pointer;transition:transform .12s}
.hand .card.no{opacity:.45;cursor:default}
.hand .card.ok:hover{transform:translateY(-10px)}
.hand .card.last{outline:3px solid var(--y)}
#col{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
#dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff}
#msg{min-height:22px;text-align:center;font-size:15px}
.me{border:2px solid transparent;border-radius:12px;padding:6px}
.hand{display:flex;gap:6px;overflow-x:auto;padding:12px 4px 6px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:5;color:#fff;font-size:20px}
.ov[hidden]{display:none}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{width:90px;height:90px;border-radius:14px;border:3px solid #fff}
.big{background:var(--y);color:#222;border:0;border-radius:10px;padding:10px 24px;font-weight:700}
</style>
</head>
<body>
<h1><span>اونو</span><button class="new" onclick="start()">بازی جدید</button></h1>
<div id="opp"></div>
<div id="mid"></div>
<div id="msg"></div>
<div class="me" id="me"><div class="hand" id="hand"></div></div>
<div class="ov" id="pick" hidden><div>رنگ را انتخاب کن</div>
<div class="pick">
<button style="background:var(--r)" onclick="chose('r')"></button>
<button style="background:var(--y)" onclick="chose('y')"></button>
<button style="background:var(--g)" onclick="chose('g')"></button>
<button style="background:var(--b)" onclick="chose('b')"></button></div></div>
<div class="ov" id="end" hidden><div id="endt"></div><button class="big" onclick="start()">دوباره بازی کن</button></div>
<script>
const NAMES=['تو','رضا','سارا','علی'],CN={r:'قرمز',y:'زرد',g:'سبز',b:'آبی'};
const L={S:'⛔',R:'⇄',D:'+۲',W:'★',F:'+۴'},FA='۰۱۲۳۴۵۶۷۸۹';
let deck,disc,hands,cur,dir,color,drew,over,pending,msg='';
const $=id=>document.getElementById(id);
const top=()=>disc[disc.length-1];
const nx=p=>(p+dir+4)%4;
const ok=c=>c.c==='w'||c.c===color||c.v===top().v;
const lab=c=>L[c.v]||FA[+c.v];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
function build(){deck=[];for(const c of'rygb'){for(let n=0;n<=9;n++){deck.push({c,v:''+n});if(n)deck.push({c,v:''+n})}
for(const v of'SRD'){deck.push({c,v});deck.push({c,v})}}
for(let i=0;i<4;i++){deck.push({c:'w',v:'W'});deck.push({c:'w',v:'F'})}shuf(deck)}
function draw(n,p){for(let i=0;i<n;i++){if(!deck.length){const t=disc.pop();deck=disc;shuf(deck);disc=[t]}
if(!deck.length)break;hands[p].push(deck.pop())}}
function start(){build();hands=[[],[],[],[]];for(let p=0;p<4;p++)draw(7,p);
const k=deck.findIndex(c=>c.c!=='w'&&!isNaN(c.v));disc=deck.splice(k,1);
color=disc[0].c;cur=0;dir=1;drew=false;over=false;pending=null;msg='نوبت توست';
$('end').hidden=true;$('pick').hidden=true;go()}
function play(p,i,col){const c=hands[p].splice(i,1)[0];disc.push(c);color=col||c.c;
let t=NAMES[p]+': '+(c.c==='w'?'کارت جوکر، رنگ '+CN[color]:lab(c)+' '+CN[c.c]);
if(hands[p].length===1)t+=' — اونو!';
if(!hands[p].length){over=true;msg=t;$('endt').textContent=p===0?'🎉 بردی!':NAMES[p]+' برد';$('end').hidden=false;render();return}
if(c.v==='R')dir=-dir;
let n=nx(p),skip=false;
if(c.v==='S')skip=true;
if(c.v==='D'){draw(2,n);skip=true;t+=' ← '+NAMES[n]+' دو کارت می‌گیرد'}
if(c.v==='F'){draw(4,n);skip=true;t+=' ← '+NAMES[n]+' چهار کارت می‌گیرد'}
cur=skip?nx(n):n;msg=t;drew=false;go()}
function go(){render();if(!over&&cur!==0)setTimeout(bot,1000)}
function bot(){if(over)return;const h=hands[cur],p=cur;
let idx=h.map((c,i)=>i).filter(i=>ok(h[i]));
if(!idx.length){draw(1,p);const l=h.length-1;
if(ok(h[l]))idx=[l];else{msg=NAMES[p]+' کارت کشید و رد شد';cur=nx(p);return go()}}
const plain=idx.filter(i=>h[i].c!=='w');const i=(plain.length?plain:idx)[Math.random()*(plain.length||idx.length)|0];
let col;if(h[i].c==='w'){const k={r:0,y:0,g:0,b:0};h.forEach(c=>{if(c.c!=='w')k[c.c]++});
col=Object.keys(k).sort((a,b)=>k[b]-k[a])[0]}
play(p,i,col)}
function chose(c){$('pick').hidden=true;const i=pending;pending=null;play(0,i,c)}
function tap(i){if(cur!==0||over)return;const h=hands[0],c=h[i];
if(!ok(c)||(drew&&i!==h.length-1))return;
if(c.c==='w'){pending=i;$('pick').hidden=false}else play(0,i)}
function pile(){if(cur!==0||over)return;
if(!drew){draw(1,0);const h=hands[0];
if(ok(h[h.length-1])){drew=true;msg='کارت کشیدی؛ بازی‌اش کن یا روی دسته بزن تا رد شوی'}
else{msg='کارت کشیدی و رد شدی';cur=nx(0)}go()}
else{drew=false;msg='رد شدی';cur=nx(0);go()}}
function cardEl(c,extra,fn){return`<div class="card ${c.c} ${extra||''}" style="background:var(--${c.c})" ${fn?`onclick="${fn}"`:''}>${lab(c)}</div>`}
function render(){
$('opp').innerHTML=[1,2,3].map(p=>`<div class="op ${cur===p&&!over?'on':''}">${NAMES[p]}<b>${hands[p].length}</b>کارت</div>`).join('');
$('mid').innerHTML=`<div class="card back" onclick="pile()" style="cursor:pointer">دسته</div>${cardEl(top())}<div id="col"><div id="dot" style="background:var(--${color})"></div>${CN[color]}</div>`;
$('hand').innerHTML=hands[0].map((c,i)=>cardEl(c,(cur===0&&ok(c)&&!over?'ok':'no')+(drew&&i===hands[0].length-1?' last':''),`tap(${i})`)).join('');
$('me').className='me'+(cur===0&&!over?' on':'');
$('msg').textContent=msg}
start();
</script>
</body>
</html>
