<!DOCTYPE html>

<head>

<style>
:root{--bg:#000;--felt:#141414;--ink:#eee;--r:#d8402f;--y:#f2b705;--g:#2e9e5b;--b:#2a6fc9;--gold:#e2b04a}
[data-theme="neon"]{--bg:#060614;--felt:#111130;--ink:#e8f4ff;--r:#ff2d78;--y:#ffe93d;--g:#35ff8a;--b:#3fa9ff;--gold:#22e6ff}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh;padding:12px;gap:12px}
h1{margin:0;font-size:20px;display:flex;justify-content:space-between;align-items:center}
button,input{font:inherit}
button{cursor:pointer}
.new{background:transparent;color:inherit;border:1px solid currentColor;border-radius:8px;padding:4px 12px;margin-right:6px}
#opp{display:flex;gap:8px}
.op{flex:1;background:var(--felt);border-radius:10px;padding:8px;text-align:center;font-size:14px;border:2px solid transparent}
.op.on,.me.on{border-color:var(--gold)}
.op b{display:block;font-size:22px}
#mid{flex:1;display:flex;align-items:center;justify-content:center;gap:24px;background:var(--felt);border-radius:14px;padding:16px;min-height:190px}
.card{width:64px;height:96px;border-radius:9px;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:none;user-select:none;text-shadow:0 1px 2px #0006}
.card.y{color:#222;text-shadow:none}
.card.back{background:var(--back) center/cover #14305a;border-color:var(--gold);cursor:pointer}
.pile{text-align:center;font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center}
.hand{display:flex;gap:6px;overflow-x:auto;padding:12px 4px 6px}
.hand .card{cursor:pointer;transition:transform .12s}
.hand .card.no{opacity:.45;cursor:default}
.hand .card.ok:hover{transform:translateY(-10px)}
.hand .card.last{outline:3px solid var(--gold)}
#col{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
#dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff}
#msg{min-height:22px;text-align:center;font-size:15px}
.me{border:2px solid transparent;border-radius:12px;padding:6px}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:5;color:#fff;font-size:18px;text-align:center;padding:20px}
.ov[hidden],[hidden]{display:none!important}
#choices{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.row{display:flex;gap:8px}
input{border-radius:10px;border:2px solid var(--gold);background:#111;color:#fff;padding:8px 12px;width:130px;text-align:center;letter-spacing:3px;text-transform:uppercase}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick button{width:90px;height:90px;border-radius:14px;border:3px solid #fff}
.big{background:var(--gold);color:#222;border:0;border-radius:10px;padding:10px 24px;font-weight:700}
h2{margin:0;font-size:32px;color:var(--gold)}
.emo{justify-content:center;align-items:center}.emo button{font-size:22px;background:var(--felt);border:0;border-radius:10px;padding:4px 8px}#myemo{font-size:30px;min-width:36px}.op .e{display:block;height:22px;font-size:18px}#unob{align-self:center;font-size:20px}
@property --p{syntax:'<number>';inherits:false;initial-value:0}
@keyframes tk{from{--p:100}to{--p:0}}
.av{--p:0;width:46px;height:46px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#8885 0)}
.av.tick{animation:tk linear forwards}
.av span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
#myav .av{margin:0 0 0 8px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
#opp{flex-wrap:wrap}.op{flex:1 1 28%;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#msg{white-space:pre-line;cursor:pointer}
@keyframes fm{from{transform:translateY(170px) scale(.8) rotate(-10deg);opacity:.2}}
@keyframes fo{from{transform:translateY(-170px) scale(.8) rotate(10deg);opacity:.2}}
@keyframes dl{from{transform:translateY(-130px);opacity:0}}
.fm{animation:fm .3s ease-out}.fo{animation:fo .3s ease-out}.hand .card.dl{animation:dl .35s ease-out}
@media(prefers-reduced-motion:reduce){.fm,.fo,.hand .card.dl{animation:none}}
#board{flex:1;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;grid-template-areas:"t t t" "l m r";gap:8px;min-height:0}
#otop{grid-area:t;display:flex;justify-content:center;gap:6px}
#oleft{grid-area:l}#oright{grid-area:r}
#oleft,#oright{display:flex;flex-direction:column;justify-content:center;gap:6px}
#mid{grid-area:m;flex:none;gap:12px;padding:8px;min-width:0}
#mid .card{width:56px;height:84px;font-size:22px}
.op{flex:0 0 auto;width:68px;padding:6px 4px;font-size:12px}
.lnk{direction:ltr;background:#111;color:var(--gold);border:2px dashed var(--gold);border-radius:10px;padding:8px 12px;font-size:15px;word-break:break-all;margin:8px 0;cursor:pointer}
.inv #choices>:not(#nm):not(#invb){display:none!important}
html,body{overflow-x:hidden}
.emo{flex-wrap:wrap;gap:4px}.emo button{font-size:18px;padding:3px 6px}
.op{overflow:visible;text-overflow:clip}
.nmx{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{position:relative}
.bub{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-style:normal;animation:pp .25s}
@keyframes pp{from{transform:scale(.3)}}
.card{position:relative}
.cn{display:none;position:absolute;top:3px;right:5px;font-size:13px;font-style:normal;line-height:1}
.hand .cn{display:block}
.hand{flex-direction:column;overflow:visible;gap:2px;padding:14px 4px 6px}
.hrow{display:flex;justify-content:center}
.hand .card.ok{transform:translateY(-8px)}
@keyframes pu{50%{transform:scale(1.1)}}
#unob.on{animation:pu .6s infinite}
#gen{z-index:30;background:#15130f;justify-content:flex-start;overflow:auto;padding:20px 12px}
#gb{width:100%;max-width:360px;text-align:right;font-size:15px;line-height:1.8}
#gb h3{margin:14px 0 4px;color:var(--gold);font-size:16px}
.rr{display:flex;gap:10px;align-items:center;margin:6px 0}.rr .card{width:40px;height:58px;font-size:16px;flex:none}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.new.sel{background:var(--gold);color:#1a1a1a}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stg div{background:#ffffff14;border-radius:10px;padding:8px;text-align:center;font-size:13px}.stg b{display:block;font-size:24px;color:var(--gold)}
.flyx{pointer-events:none;z-index:60}
</style>
</head>
<body>
<h1><span>اونو</span><span><button class="new" id="nb" onclick="newGame()">بازی جدید</button><button class="new" onclick="showRules()">📖</button><button class="new" onclick="showStats()">📊</button><button class="new" onclick="showSet()">⚙️</button><button class="new" onclick="leaveAll()">منو</button></span></h1>
<div id="board"><div id="otop"></div><div id="oleft"></div><div id="mid"></div><div id="oright"></div></div>
<div id="msg"></div><button class="big" id="unob" style="visibility:hidden" onclick="act('uno')">اونو!</button>
<div class="me" id="me"><div class="hand" id="hand"></div></div><div class="row emo" id="emo"></div>

<div class="ov" id="menu"><h2>اونو</h2>
<div id="choices">
<input id="nm" placeholder="اسمت" maxlength="12" style="letter-spacing:0;text-transform:none;width:100%">
<button class="big" id="rj" hidden onclick="join(getSess())"></button>
<button class="big" id="invb" hidden onclick="join(getSess()&&getSess().code===$('code').value?getSess():undefined)">ورود به بازی</button>
<div class="row" style="justify-content:center;gap:8px"><button class="new" onclick="showRules()">📖 قوانین</button><button class="new" onclick="showStats()">📊 آمار</button><button class="new" onclick="showSet()">⚙️ تنظیمات</button></div>
<label>تعداد بازیکن: <select id="np" style="font:inherit;padding:4px 8px;border-radius:8px"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
<button class="big" onclick="startLocal()">بازی با بات‌ها</button>
<button class="big" onclick="host()">ساخت اتاق آنلاین</button>
<div class="row"><input id="code" placeholder="کد اتاق" maxlength="5"><button class="big" onclick="join()">ورود</button></div>
<button class="new" id="rb" onclick="$('rules').hidden=false">قوانین بازی</button>
<button class="big" id="inst" hidden onclick="ip.prompt();this.hidden=true">نصب برنامه</button>
</div>
<div id="info"></div>
<button class="big" id="go" hidden onclick="start(1)">شروع بازی</button></div>

<div class="ov" id="pick" hidden><div>رنگ را انتخاب کن</div>
<div class="pick">
<button style="background:var(--r)" onclick="chose('r')"></button>
<button style="background:var(--y)" onclick="chose('y')"></button>
<button style="background:var(--g)" onclick="chose('g')"></button>
<button style="background:var(--b)" onclick="chose('b')"></button></div></div>

<div class="ov" id="gen" hidden><h2 id="gt"></h2><div id="gb"></div><button class="big" onclick="$('gen').hidden=true">بستن</button></div>
<div class="ov" id="end" hidden><div id="endt"></div><button class="big" id="again" onclick="next()">شروع دست بعد</button><div class="row" id="cl" hidden><button class="big" id="rdy" onclick="act('ready')">✅ آماده‌ام</button><button class="new" id="lv" onclick="leaveRoom()">🚪 خروج</button></div></div>

<script>
const BACK="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 96'><rect width='64' height='96' fill='#14305a'/><rect x='3.5' y='3.5' width='57' height='89' rx='5' fill='none' stroke='#e2b04a' stroke-width='1.4'/><g transform='translate(32 48)' stroke='#e2b04a' stroke-width='1.3'><ellipse rx='21' ry='36' fill='#0f6e73'/><rect x='-14' y='-14' width='28' height='28' fill='#14305a'/><rect x='-14' y='-14' width='28' height='28' fill='#14305a' transform='rotate(45)'/><circle r='7' fill='#b83227'/><circle r='2.2' fill='#e2b04a' stroke='none'/></g><g fill='#e2b04a'><circle cx='32' cy='10' r='2.4'/><circle cx='32' cy='86' r='2.4'/><circle cx='10' cy='48' r='2'/><circle cx='54' cy='48' r='2'/></g></svg>";
document.documentElement.style.setProperty('--back','url("data:image/svg+xml,'+encodeURIComponent(BACK)+'")');
const NAMES=['تو','رضا','سارا','علی','مریم','حسین'],CN={r:'قرمز',y:'زرد',g:'سبز',b:'آبی'};
const L={S:'⛔',R:'⇄',D:'+۲',W:'★',F:'+۴'},FA='۰۱۲۳۴۵۶۷۸۹';
let deck,disc,hands,cur,dir,color,drew,over,winner,msg='',pending,V,timer,stack=0,unoP=-1,called=false,scores=[0,0,0,0],pts=0,matchDone=false,sortOn=true,ready=[],pre=-1,N=4,hist=[],lastMsg='',pv=null,fl={},histOn=false,lack=[],dl=0,tmo,lastCur=-1,lastHum=false,tt=1100,pname=[],tokens=[],ip,emos=['','','','','',''],et=[],lastMove=null,spects=[],spectMode=false;
let TT=20000,TARGET=200,BOTS=1;
const SIGNAL={},ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}/*,{urls:'turn:YOUR_TURN_HOST:3478',username:'USER',credential:'PASS'}*/],EM=['😂','👏','😡','😎','🤔','🔥'];
let net='local',peer,conn,conns={},hum=new Set([0]),names=NAMES.slice(),code='',started=false;
const $=id=>document.getElementById(id);
const topCard=()=>disc[disc.length-1];
const nx=p=>(p+dir+N)%N;
const ok=(c,t=topCard(),col=color,s=stack)=>s>0?(c.v==='D'||c.v==='F'):(c.c==='w'||c.c===col||c.v===t.v);
const lab=c=>L[c.v]||FA[+c.v];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}}
function build(){deck=[];for(const c of'rygb'){for(let n=0;n<=9;n++){deck.push({c,v:''+n});if(n)deck.push({c,v:''+n})}
for(const v of'SRD'){deck.push({c,v});deck.push({c,v})}}
for(let i=0;i<4;i++){deck.push({c:'w',v:'W'});deck.push({c:'w',v:'F'})}shuf(deck)}
function draw(n,p){for(let i=0;i<n;i++){if(!deck.length){const t=disc.pop();deck=disc;shuf(deck);disc=[t]}
if(!deck.length)break;hands[p].push(deck.pop())}}

/* ---------- موتور بازی (روی دستگاه میزبان) ---------- */
function start(r){if(r||scores.length!==N)scores=Array(N).fill(0);matchDone=false;stack=0;unoP=-1;pre=-1;ready=[];lastCur=-1;hist=[];lastMsg='';pv=null;lastMove=null;lack=Array.from({length:N},()=>new Set());build();hands=Array.from({length:N},()=>[]);for(let p=0;p<N;p++)draw(7,p);
const k=deck.findIndex(c=>c.c!=='w'&&!isNaN(c.v));disc=deck.splice(k,1);
color=disc[0].c;cur=0;dir=1;drew=false;over=false;winner=-1;pending=null;started=true;
names[0]=myName()||NAMES[0];hum=new Set([0]);
for(const s in conns){hum.add(+s);names[s]=pname[s]||'دوست '+FA[s]}
msg='بازی شروع شد';$('menu').hidden=true;$('end').hidden=true;$('pick').hidden=true;go()}
function play(p,i,col){const c=hands[p].splice(i,1)[0];
/* قانون جدید: همهٔ کارت‌های هم‌رنگ همراهش روی میز می‌آیند */
const extra=[];
if(c.c!=='w'){for(let j=hands[p].length-1;j>=0;j--){if(hands[p][j].c===c.c)extra.push(hands[p].splice(j,1)[0])}}
extra.forEach(x=>disc.push(x));disc.push(c);
lack[p].delete(c.c);color=col||c.c;lastMove={p,i,c};
let t=names[p]+': '+(c.c==='w'?'جوکر، رنگ '+CN[color]:lab(c)+' '+CN[c.c]);
if(extra.length)t+=' + '+fa(extra.length)+' کارت '+CN[c.c]+' دیگر';
if(hands[p].length===1){unoP=p;called=(!hum.has(p)&&Math.random()<.8)||pre===p;pre=-1;t+=called?' — اونو!':' — یک کارت مانده'}
if(!hands[p].length){over=true;winner=p;msg=t;pts=hands.reduce((s,h)=>s+h.reduce((a,c)=>a+(c.c==='w'?50:isNaN(c.v)?20:+c.v),0),0);scores[p]+=pts;matchDone=scores[p]>=TARGET;return go()}
let skips=0;
if(c.v==='S')skips++;
if(c.v==='R'){dir=-dir;if(N===2)skips++}
for(const x of extra){if(x.v==='S')skips++;else if(x.v==='R'){dir=-dir;if(N===2)skips++}else if(x.v==='D')stack+=2;else if(x.v==='F')stack+=4}
let n=nx(p);while(skips-->0)n=nx(n);
if(c.v==='D'||c.v==='F'||extra.some(x=>x.v==='D'||x.v==='F')){t+=' ← '+names[n]+' باید '+fa(stack)+' کارت بگیرد یا +روی هم بگذارد'}
cur=n;msg=t;drew=false;go()}
function apply(p,t,i,col){if(over||cur!==p)return;const h=hands[p];
if(t==='play'){const c=h[i];if(!c||!ok(c)||(drew&&i!==h.length-1))return;
if(c.c==='w'&&!'rygb'.includes(col))return;unoP=-1;play(p,i,c.c==='w'?col:null)}
else if(t==='pile'){unoP=-1;pre=-1;if(stack>0){draw(stack,p);msg=names[p]+' '+fa(stack)+' کارت گرفت';stack=0;drew=false;cur=nx(p)}
else if(!drew){lack[p].add(color);draw(1,p);const l=h[h.length-1];
if(l&&ok(l)){drew=true;msg=names[p]+' کارت کشید'}
else{msg=names[p]+' کارت کشید و رد شد';cur=nx(p)}}
else{drew=false;msg=names[p]+' رد شد';cur=nx(p)}
go()}}
function view(s){return{hand:hands[s],counts:hands.map(h=>h.length),top:topCard(),color,cur,msg,over,winner,drew:drew&&cur===s,me:s,names,stack,uno:unoP>=0&&!called?unoP:-1,scores,pts,matchDone,target:TARGET,cfg:{tt:TT/1000,target:TARGET,bots:BOTS},st:Array.from({length:N},(_,i)=>i===0?'h':hum.has(i)?(ready[i]?'r':'w'):'b'),n:N,dir,hist,dn:disc.length,tl:Math.max(0,dl-Date.now()),tt,pre:pre===s}}
function specView(){const v=view(0);v.hand=[];v.spec=true;return v}
function go(){if(msg!==lastMsg){hist.unshift(msg);hist.length=Math.min(hist.length,8);lastMsg=msg}const hh=hum.has(cur);if(over){clearTimeout(tmo);lastCur=-1}else if(cur!==lastCur||hh!==lastHum){lastCur=cur;lastHum=hh;clearTimeout(tmo);tt=hh?TT:Math.round(1100*BOTS);dl=Date.now()+tt;if(hh)tmo=setTimeout(timeUp,TT)}
V=view(0);render();
for(const s in conns){try{conns[s].send({t:'state',v:view(+s)})}catch(e){}}
for(const sp of spects){try{sp.send({t:'state',v:specView()})}catch(e){}}
clearTimeout(timer);if(!over&&!hum.has(cur))timer=setTimeout(bot,unoP>=0&&!called?(hum.has(unoP)?3500:2500):Math.round(1000*BOTS))}
function bot(){if(over)return;const h=hands[cur],p=cur,n=nx(p);
if(unoP>=0&&!called&&unoP!==p&&Math.random()<.6)return callUno(p);unoP=-1;
let idx=h.map((c,i)=>i).filter(i=>ok(h[i]));
if(!idx.length){if(stack>0){draw(stack,p);msg=names[p]+' '+fa(stack)+' کارت گرفت';stack=0;cur=nx(p);return go()}
lack[p].add(color);draw(1,p);const l=h.length-1;
if(l>=0&&ok(h[l]))idx=[l];else{msg=names[p]+' کارت کشید و رد شد';cur=nx(p);return go()}}
const cnt={r:0,y:0,g:0,b:0};h.forEach(c=>{if(c.c!=='w')cnt[c.c]++});
const hot=hands[n].length<=2,allW=idx.every(j=>h[j].c==='w');
const sc=i=>{const c=h[i];let x=Math.random();
if(c.c==='w'){x-=hot&&c.v==='F'?-80:50;if(h.length<=2||allW)x+=50}
else{x+=cnt[c.c]*2+(isNaN(c.v)?(hot?20:4):+c.v*.5)}
return x};
let i=idx[0],best=-1e9;for(const j of idx){const v=sc(j);if(v>best){best=v;i=j}}
let col;if(h[i].c==='w'){const k={r:0,y:0,g:0,b:0};h.forEach((c,j)=>{if(j!==i&&c.c!=='w')k[c.c]+=2});
for(const x in k)if(lack[n].has(x))k[x]+=3;
col=Object.keys(k).sort((a,b)=>k[b]-k[a]||Math.random()-.5)[0]}
play(p,i,col);if(Math.random()<.07)emoAll(p,EM[Math.random()*EM.length|0])}

/* ---------- ورودی بازیکن ---------- */
function act(t,i,col){if(V&&V.spec)return;if(net==='client')conn.send({t,i,col});else if(t==='uno')callUno(0);else apply(0,t,i,col)}
function tap(i){if(!V||V.spec||V.cur!==V.me||V.over)return;const h=V.hand,c=h[i];
if(!ok(c,V.top,V.color,V.stack)||(V.drew&&i!==h.length-1))return;
if(c.c==='w'){pending=i;$('pick').hidden=false}else act('play',i)}
function chose(c){$('pick').hidden=true;act('play',pending,c);pending=null}
function pile(){if(!V||V.spec||V.cur!==V.me||V.over)return;act('pile')}

/* ---------- نمایش ---------- */
function cardEl(c,extra,fn,st){return`<div class="card ${c.c} ${extra||''}" style="background:var(--${c.c});${st||''}" ${fn?`onclick="${fn}"`:''}><i class="cn">${lab(c)}</i>${lab(c)}</div>`}
function render0(){
if(V.spec){$('me').style.display='none';$('emo').style.display='none'}

function togMute(){mute=!mute;savePrefs();$('mb').style.opacity=mute?.4:1;if(!$('gen').hidden)showSet()}
function togSort(){sortOn=!sortOn;savePrefs();if(V){fl={};render0()}if(!$('gen').hidden)showSet()}
function curTheme(){try{return localStorage.getItem('uno-theme')||''}catch(e){return''}}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('uno-theme',t)}catch(e){}if(!$('gen').hidden)showSet()}
function setCfg(k,v){if(net==='client')return;if(k==='tt')TT=v*1000;else if(k==='target')TARGET=v;else BOTS=v;
try{localStorage.setItem('uno-cfg',JSON.stringify({tt:TT/1000,target:TARGET,bots:BOTS}))}catch(e){}if(V&&typeof started!=='undefined'&&started)go();showSet()}
function newGame(){if(net==='client'||spectMode)return;if(net==='host'&&!over&&!confirm('بازی جدید شروع شود؟ امتیازها صفر می‌شود.'))return;start(1)}
function leaveRoom(){try{localStorage.removeItem('uno-sess')}catch(e){}try{conn&&conn.send({t:'leave'})}catch(e){}setTimeout(()=>location.reload(),250)}
/* ---------- خروج میزبان و واگذاری بازی ---------- */
function fullState(){return{N,deck,disc,hands,cur,dir,color,stack,drew,over,winner,scores,pts,matchDone,msg,names:names.slice(),hum:[...hum],ready:ready.slice(),tokens:{...tokens},pname:{...pname},unoP,called}}
function leaveAll(){if(net==='host')return hostLeave();if(net==='client')return leaveRoom();location.reload()}
function hostLeave(){
if(!started||over||!Object.keys(conns).length){byeHost(false);return}
if(!confirm('با خروج تو، بازی به نخستین بازیکن واگذار می‌شود و برای بقیه ادامه پیدا می‌کند. مطمئنی؟'))return;
byeHost(true)}
function byeHost(mig){
if(mig){const st=fullState();const ks=Object.keys(conns).map(Number).sort((a,b)=>a-b);const k=ks[0];
if(k!==undefined){
const oh=st.hands[0];st.hands[0]=st.hands[k];st.hands[k]=oh;
st.names[0]=st.pname[k]||st.names[k];st.names[k]=NAMES[k];st.pname[0]=st.names[0];
st.hum=st.hum.filter(x=>x!==k);if(!st.hum.includes(0))st.hum.push(0);
try{conns[k].send({t:'promote',state:st,code})}catch(e){}
for(const o of ks)if(o!==k){try{conns[o].send({t:'migrate'})}catch(e){}}
for(const sp of spects){try{sp.send({t:'migrate'})}catch(e){}}}}
try{localStorage.removeItem('uno-sess')}catch(e){}
try{peer&&peer.destroy()}catch(e){}
setTimeout(()=>location.reload(),500)}
function becomeHost(st,cd){
try{localStorage.setItem('uno-sess',JSON.stringify({code:cd,seat:0,token:(st.tokens&&st.tokens[0])||Math.random().toString(36).slice(2)}))}catch(e){}
net='host';code=cd;started=true;spectMode=false;spects=[];conns={};
N=st.N;deck=st.deck;disc=st.disc;hands=st.hands;cur=st.cur;dir=st.dir;color=st.color;stack=st.stack;drew=st.drew;over=st.over;winner=st.winner;
scores=st.scores;pts=st.pts;matchDone=st.matchDone;msg=st.msg;names=st.names;pname=st.pname||{};tokens=st.tokens||{};
hum=new Set((st.hum||[]).filter(x=>x!==0).concat([0]));ready=st.ready||[];unoP=st.unoP??-1;called=!!st.called;pre=-1;
hist=[];lastMsg='';pv=null;lastMove=null;dl=0;lastCur=-1;lastHum=false;
lack=Array.from({length:N},()=>new Set());emos=['','','','','',''];
names[0]=myName()||names[0]||'میزبان';pname[0]=names[0];
clearTimeout(tmo);clearTimeout(timer);
try{peer&&peer.destroy()}catch(e){}
peer=new Peer('uno-'+cd,{...SIGNAL,config:{iceServers:ICE}});
peer.on('open',()=>{msg+=' — میزبان جدید: '+names[0];go();
setTimeout(()=>{if(net!=='host'||!started)return;let ch=false;
for(let i=1;i<N;i++)if(hum.has(i)&&!conns[i]){hum.delete(i);names[i]=NAMES[i];ch=true}
if(ch){msg='بازیکنان واردنشده با بات جایگزین شدند';go()}},25000)});
peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(x){}setTimeout(()=>{if(net==='host'&&!peer.open)becomeHost(st,cd)},2000)}});
peer.on('connection',setupConn);
$('menu').hidden=true;$('end').hidden=true;$('pick').hidden=true}
function gen(t,h){$('gt').textContent=t;$('gb').innerHTML=h;$('gen').hidden=false}
function showSet(){const host=net!=='client',c=cfgv();
const sw=(t,on,f)=>`<div class="srow"><span>${t}</span><button class="new${on?' sel':''}" onclick="${f}()">${on?'روشن':'خاموش'}</button></div>`;
const ob=(k,v,t)=>`<button class="new${c[k]===v?' sel':''}" onclick="setCfg('${k}',${v})">${t}</button>`;
let h='<h3>شخصی</h3>'+sw('🔊 صدا',!mute,'togMute')+sw('🎨 مرتب‌سازی کارت‌ها',sortOn,'togSort');
const th=curTheme();
h+='<h3>🎨 پوسته</h3><div class="srow"><span>تم بازی</span><span>'+[['','کلاسیک'],['neon','نئون'],['candy','کارتونی']].map(([v,t])=>`<button class="new${th===v?' sel':''}" onclick="setTheme('${v}')">${t}</button>`).join('')+'</span></div>';
if(host){h+='<h3>👑 تنظیمات میزبان</h3>'+`<div class="srow"><span>⏱️ زمان نوبت</span><span>${[10,20,30,60].map(v=>ob('tt',v,fa(v)+' ث')).join('')}</span></div><div class="srow"><span>🏆 هدف امتیاز</span><span>${[100,200,300,500].map(v=>ob('target',v,fa(v))).join('')}</span></div><div class="srow"><span>🤖 سرعت بات</span><span>${ob('bots',.6,'سریع')}${ob('bots',1,'معمولی')}${ob('bots',1.7,'آرام')}</span></div>`;
if(net==='host'){const ks=Object.keys(conns);if(ks.length)h+='<h3>بازیکن‌ها</h3>'+ks.map(k=>`<div class="srow"><span>${esc(names[k])}</span><button class="new" onclick="kick(${k});showSet()">✕ حذف</button></div>`).join('')}}
else h+=`<h3>تنظیمات میزبان</h3><div class="srow"><span>⏱️ زمان نوبت</span><b>${fa(c.tt)} ثانیه</b></div><div class="srow"><span>🏆 هدف امتیاز</span><b>${fa(c.target)}</b></div>`;
gen('⚙️ تنظیمات',h)}
function showRules(){const c=cfgv(),k=(a,b)=>cardEl({c:a,v:b},'');
gen('📖 قوانین',`<h3>🎯 هدف</h3><p>زودتر از همه کارت‌هات رو تموم کن. برندهٔ هر دست امتیاز کارت‌های باقی‌ماندهٔ بقیه رو می‌گیره و اولین نفری که به ${fa(c.target)} امتیاز برسه، مسابقه رو می‌بره.</p>
<h3>🃏 نوبت تو</h3><p>یک کارت هم‌رنگ یا هم‌عدد/هم‌نماد با کارت وسط بنداز. کارت نداری یا نمی‌خوای؟ از دسته بکش؛ اگه کارت کشیده‌شده بخوره می‌تونی بندازیش، وگرنه نوبت می‌ره.</p>
<h3>🂡 قانون ریختن هم‌رنگ‌ها</h3><p>وقتی کارتی (غیر از جوکر) می‌ندازی، <b>همهٔ کارت‌های هم‌رنگِ دستت خودکار همراهش روی میز می‌آیند</b> و اثر هر کدام (رد، برعکس، +۲ و…) اعمال می‌شود!</p>
<h3>✨ کارت‌های ویژه</h3>
<div class="rr">${k('r','S')}<span><b>رد کردن:</b> نوبت نفر بعدی می‌سوزه.</span></div>
<div class="rr">${k('b','R')}<span><b>برعکس:</b> جهت بازی عوض می‌شه (در بازی ۲ نفره مثل رد کردنه).</span></div>
<div class="rr">${k('g','D')}<span><b>+۲:</b> نفر بعدی ۲ کارت می‌گیره، مگر اینکه +۲ یا +۴ روش بذاره؛ اون‌وقت جریمه جمع می‌شه.</span></div>
<div class="rr">${k('w','W')}<span><b>جوکر:</b> روی هر کارتی میاد و رنگ رو خودت انتخاب می‌کنی.</span></div>
<div class="rr">${k('w','F')}<span><b>+۴:</b> جوکر با ۴ کارت جریمه؛ قابل جمع شدن با +۲ و +۴ بعدی.</span></div>
<h3>📣 اونو!</h3><p>وقتی ۲ کارت داری و نوبتته، قبل از انداختن کارت دکمهٔ «اونو!» رو بزن. اگه با ۱ کارت موندی و نگفتی، بقیه می‌تونن «گرفتمش!» بزنن و ۲ کارت جریمه بگیری.</p>
<h3>⏱️ زمان</h3><p>${fa(c.tt)} ثانیه برای هر نوبت وقت داری؛ بعدش خودکار کارت می‌کشی. حلقهٔ دور آواتار زمان باقی‌مونده رو نشون می‌ده.</p>
<h3>🏆 امتیاز کارت‌ها</h3><p>عددها = خودشون، ⛔ ⇄ +۲ = ۲۰، جوکر و +۴ = ۵۰.</p>
<h3>🌐 بازی آنلاین</h3><p>میزبان اتاق رو می‌سازه و لینک رو می‌فرسته. اگه اتاق پر باشه می‌تونی به‌عنوان <b>تماشاگر 👁</b> بازی رو ببینی. اگه میزبان وسط بازی خارج بشه، بازی به یکی از بازیکنان واگذار می‌شه و بقیه خودکار وصل می‌شن.</p>`)}
const getSt=()=>{try{return Object.assign({g:0,w:0,l:0,st:0,best:0,mw:0,top:0},JSON.parse(localStorage.getItem('uno-stats')||'{}'))}catch(e){return{g:0,w:0,l:0,st:0,best:0,mw:0,top:0}}};
function rec(win,p,md){const t=getSt();t.g++;if(win){t.w++;t.st++;t.best=Math.max(t.best,t.st);t.top=Math.max(t.top,p||0);if(md)t.mw++}else{t.l++;t.st=0}try{localStorage.setItem('uno-stats',JSON.stringify(t))}catch(e){}}
function showStats(){const t=getSt(),b=(n,l)=>`<div><b>${fa(n)}</b>${l}</div>`;
gen('📊 آمار من',`<div class="stg">${b(t.g,'دست بازی‌شده')}${b(t.g?Math.round(t.w/t.g*100):0,'درصد برد')}${b(t.w,'برد')}${b(t.l,'باخت')}${b(t.st,'برد پشت‌هم فعلی')}${b(t.best,'بهترین برد پشت‌هم')}${b(t.mw,'مسابقهٔ برده')}${b(t.top,'بیشترین امتیاز یک دست')}</div><p style="text-align:center"><button class="new" onclick="if(confirm('آمار صفر شود؟')){localStorage.removeItem('uno-stats');showStats()}">صفر کردن آمار</button></p>`)}
try{const c=JSON.parse(localStorage.getItem('uno-cfg')||'null');if(c){TT=(+c.tt||20)*1000;TARGET=+c.target||200;BOTS=+c.bots||1}const q=JSON.parse(localStorage.getItem('uno-prefs')||'null');if(q){mute=!!q.mute;sortOn=q.sort!==false}}catch(e){}
try{const th=localStorage.getItem('uno-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
$('mb').style.opacity=mute?.4:1;
showRj();
const rm=new URLSearchParams(location.search).get('room');if(rm){$('code').value=rm.toUpperCase().slice(0,5);document.body.classList.add('inv');$('invb').hidden=false;$('invb').textContent='ورود به اتاق '+$('code').value}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('inst').hidden=false});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
